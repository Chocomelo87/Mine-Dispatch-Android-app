<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20252a">
<title>Mine Dispatch | Offline Operations</title>
<style>
:root {
  --bg:#f2f4f5; --panel:#fff; --ink:#20252a; --muted:#6c757d;
  --line:#dfe3e6; --dark:#20252a; --orange:#ef7d22; --green:#21834a;
  --yellow:#b7791f; --red:#c0392b; --blue:#2477a5; --radius:12px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--dark);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.brand{padding:4px 10px 18px;border-bottom:1px solid #41474d}
.brand strong{font-size:17px;letter-spacing:.03em}
.brand small{display:block;color:#aab1b7;margin-top:5px}
.nav{display:grid;gap:5px}
.nav button{border:0;color:#d5dadd;background:transparent;text-align:left;border-radius:8px;padding:11px 12px}
.nav button:hover,.nav button.active{background:#383f45;color:#fff}
.nav button.active{box-shadow:inset 3px 0 var(--orange)}
.side-foot{margin-top:auto;color:#aab1b7;font-size:12px;line-height:1.6;padding:10px}
main{min-width:0}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}
.topbar h1{font-size:19px;margin:0}
.top-actions{display:flex;align-items:center;gap:10px}
.content{padding:26px;max-width:1500px;margin:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(4,minmax(130px,1fr));margin:18px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:0 2px 8px #17212b08}
.stat-label{font-size:12px;color:var(--muted);font-weight:650}
.stat-value{font-size:27px;font-weight:750;margin-top:8px}
.stat-note{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:16px;margin:0 0 12px}
.btn{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:9px 13px;font-weight:650}
.btn:hover{background:#f5f6f7}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.dark{background:#343b41;border-color:#343b41;color:#fff}
.btn.danger{color:var(--red);border-color:#e8c5c1}
.btn.small-btn{padding:6px 9px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;background:#eef0f2;color:#555}
.pill.green{background:#e5f4ea;color:var(--green)} .pill.yellow{background:#fff3d9;color:#99620d}
.pill.red{background:#fde8e6;color:var(--red)} .pill.blue{background:#e5f2f8;color:var(--blue)}
.pill.grey{background:#eceff1;color:#596168}
.dot{width:8px;height:8px;background:currentColor;border-radius:50%}
.cols{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f2;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.table-wrap{overflow:auto}
.empty{padding:26px;text-align:center;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;color:#515a61}
input,select,textarea{width:100%;border:1px solid #cfd5d9;border-radius:8px;padding:10px;background:#fff;color:var(--ink)}
textarea{min-height:78px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal-backdrop{position:fixed;inset:0;background:#1119;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 70px #0004}
.modal h2{margin:0 0 17px;font-size:19px}
.notice{padding:12px 14px;border-radius:9px;background:#fff5e7;color:#765014;font-size:13px;margin-bottom:15px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.activity{display:grid;gap:12px}
.activity-item{border-left:2px solid #e3e6e8;padding:1px 0 5px 12px;font-size:13px}
.activity-item time{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.issue{border:1px solid #f1dfb8;background:#fffaf0;border-radius:9px;padding:11px;margin:8px 0;font-size:13px}
.progress{height:7px;background:#e9ecef;border-radius:99px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--orange)}
.file-link{font-size:12px}
.hidden{display:none!important}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 .sidebar{position:sticky;top:0;z-index:5;padding:8px 10px}
 .brand{display:none}
 .nav{display:flex;overflow:auto}
 .nav button{white-space:nowrap}
 .side-foot{display:none}
 .topbar{height:60px;padding:0 15px}
 .content{padding:16px}
 .stats{grid-template-columns:repeat(2,minmax(120px,1fr))}
 .cols{grid-template-columns:1fr}
}
@media(max-width:520px){
 .stats{gap:9px}.stat-value{font-size:23px}
 .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
 .topbar h1{font-size:16px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><strong>MINE DISPATCH</strong><small>Loading &amp; operations</small></div>
    <nav class="nav" id="nav">
      <button class="active" data-page="Dashboard">▦ &nbsp; Dashboard</button>
      <button data-page="Trucks">▰ &nbsp; Truck registration</button>
      <button data-page="Drivers">♙ &nbsp; Driver management</button>
      <button data-page="Loads">⇄ &nbsp; Loading records</button>
      <button data-page="Documents">▤ &nbsp; Document centre</button>
      <button data-page="Weighbridge">⚖ &nbsp; Weighbridge</button>
      <button data-page="Dispatch">➜ &nbsp; Dispatch register</button>
      <button data-page="Missing documents">! &nbsp; Missing documents</button>
      <button data-page="Reports">▥ &nbsp; Reports &amp; backup</button>
    </nav>
    <div class="side-foot">Offline-first local workspace<br>Records stay on this device.</div>
  </aside>

  <main>
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-actions">
        <span id="connection" class="pill"><i class="dot"></i> Checking</span>
        <button class="btn primary" id="newLoad">＋ New truck loading</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" role="dialog" aria-modal="true">
    <div class="row"><h2 id="modalTitle">New record</h2><button class="btn small-btn" id="closeModal">Close</button></div>
    <div id="modalBody"></div>
  </section>
</div>

<script>
"use strict";
const DB_NAME = "mine-dispatch-local";
const STORE_NAMES = ["trucks","drivers","loads","documents","audit"];
let db;
let page = "Dashboard";
let data = {trucks:[],drivers:[],loads:[],documents:[],audit:[]};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const uid = () => crypto.randomUUID ? crypto.randomUUID() :
  "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
const timeNow = () => new Date().toISOString();
const fmt = v => v ? new Date(v).toLocaleString() : "—";
const weightTonnes = (value, unit) => {
  const n = Number(value);
  return unit === "kg" ? n / 1000 : n;
};
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME,1);
    req.onupgradeneeded = () => {
      const d = req.result;
      for(const name of STORE_NAMES){
        if(!d.objectStoreNames.contains(name)) d.createObjectStore(name,{keyPath:"id"});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function txStore(name,mode="readonly"){
  return db.transaction(name,mode).objectStore(name);
}
function getAll(name){
  return new Promise((resolve,reject)=>{
    const r=txStore(name).getAll();
    r.onsuccess=()=>resolve(r.result||[]);
    r.onerror=()=>reject(r.error);
  });
}
function put(name,record){
  return new Promise((resolve,reject)=>{
    const t=db.transaction(name,"readwrite");
    t.objectStore(name).put(record);
    t.oncomplete=()=>resolve(record);
    t.onerror=()=>reject(t.error);
  });
}
async function refresh(){
  for(const n of STORE_NAMES) data[n]=await getAll(n);
  render();
}
async function audit(action,details){
  const entry={id:uid(),action,details,at:timeNow(),actor:"Local operator"};
  await put("audit",entry);
  data.audit=await getAll("audit");
}
function statusClass(s){
  const x=(s||"").toLowerCase();
  if(x.includes("approved")||x.includes("verified")||x==="dispatched"||x==="closed") return "green";
  if(x.includes("missing")||x.includes("rejected")||x.includes("blocked")) return "red";
  if(x.includes("loading")||x.includes("weighbridge")||x.includes("weighed")) return "blue";
  if(x.includes("pending")||x.includes("awaiting")||x.includes("incomplete")) return "yellow";
  return "grey";
}
function pill(s){return `<span class="pill ${statusClass(s)}">${esc(s||"Pending")}</span>`}
function byId(list,id){return list.find(x=>x.id===id)}
function truckName(id){const t=byId(data.trucks,id);return t ? t.registration : "Unselected"}
function driverName(id){const d=byId(data.drivers,id);return d ? d.name : "Unselected"}
function docsFor(load){return data.documents.filter(d=>d.loadId===load.id)}
function requiredDocs(load){
  const base=["Purchase order","Loading instruction","Driver licence","Vehicle licence","Tare weighbridge ticket","Gross weighbridge ticket","Delivery note"];
  if(load.type==="Export") base.push("Commercial invoice","Packing list","Export permit / authorisation");
  return base;
}
function docState(load,type){
  const d=docsFor(load).filter(x=>x.type===type).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];
  return d ? d.status : "Missing";
}
function checklist(load){
  return requiredDocs(load).map(t=>({type:t,status:docState(load,t)}));
}
function missingCount(load){
  return checklist(load).filter(x=>x.status!=="Verified").length;
}
function loadRef(){
  const d=new Date();
  const date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("");
  return "RL-"+date+"-"+String(data.loads.length+1).padStart(3,"0");
}
function render(){
  $("#pageTitle").textContent=page;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  const v=$("#view");
  if(page==="Dashboard") v.innerHTML=dashboard();
  else if(page==="Trucks") v.innerHTML=truckPage();
  else if(page==="Drivers") v.innerHTML=driverPage();
  else if(page==="Loads") v.innerHTML=loadsPage();
  else if(page==="Documents") v.innerHTML=documentsPage();
  else if(page==="Weighbridge") v.innerHTML=weighPage();
  else if(page==="Dispatch") v.innerHTML=dispatchPage();
  else if(page==="Missing documents") v.innerHTML=issuesPage();
  else if(page==="Reports") v.innerHTML=reportsPage();
  updateConnection();
}
function dashboard(){
  const today=new Date().toDateString();
  const todays=data.loads.filter(l=>new Date(l.createdAt).toDateString()===today);
  const count=s=>data.loads.filter(l=>l.status===s).length;
  const active=data.loads.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,8);
  const tonnes=todays.reduce((sum,l)=>sum+(Number(l.netTonnes)||0),0);
  return `<div class="row"><div><div class="muted">Mine operations overview</div><div class="small muted">Local records on this device · ${fmt(timeNow())}</div></div><button class="btn" data-action="add-truck">＋ Register truck</button></div>
  <div class="grid stats">
    ${stat("Trucks expected",count("Booking created")+count("Truck allocated"))}
    ${stat("Awaiting verification",count("Awaiting document verification")+count("Documents incomplete"))}
    ${stat("Approved / loading",count("Approved for loading")+count("Loading in progress"))}
    ${stat("Awaiting dispatch",count("Awaiting dispatch clearance"))}
    ${stat("Dispatched today",todays.filter(l=>l.status==="Dispatched").length)}
    ${stat("Domestic loads today",todays.filter(l=>l.type==="Domestic").length)}
    ${stat("Export loads today",todays.filter(l=>l.type==="Export").length)}
    ${stat("Tonnes recorded today",tonnes.toFixed(2))}
  </div>
  <div class="cols">
    <section class="card"><div class="row"><h2 class="section-title">Recent loading activity</h2><button class="btn small-btn" data-goto="Loads">All loads</button></div>
      ${active.length?`<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Truck / driver</th><th>Load</th><th>Status</th><th>Updated</th></tr></thead><tbody>${active.map(l=>`<tr><td><strong>${esc(l.ref)}</strong></td><td>${esc(truckName(l.truckId))}<br><span class="muted small">${esc(driverName(l.driverId))}</span></td><td>${esc(l.type)} · ${esc(l.commodity)}</td><td>${pill(l.status)}</td><td>${fmt(l.updatedAt)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No loading records yet. Create a loading to get started.</div>`}
    </section>
    <section class="card"><h2 class="section-title">Outstanding documentation</h2>
      ${data.loads.filter(l=>missingCount(l)>0 && l.status!=="Dispatched").slice(0,6).map(l=>`<div class="issue"><strong>${esc(l.ref)}</strong> · ${missingCount(l)} item(s) require verification<br><span class="muted">${esc(truckName(l.truckId))} · ${esc(l.type)}</span></div>`).join("") || `<div class="empty">No outstanding document checks.</div>`}
      <div class="progress"><span style="width:${data.loads.length?Math.round(data.loads.filter(l=>missingCount(l)===0).length/data.loads.length*100):0}%"></span></div>
      <div class="small muted" style="margin-top:8px">Document completion across all loads</div>
    </section>
  </div>
  <section class="card" style="margin-top:14px"><div class="row"><h2 class="section-title">Local activity log</h2><span class="small muted">Latest recorded events</span></div>
    ${data.audit.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,5).map(a=>`<div class="activity-item">${esc(a.action)} — ${esc(a.details)}<time>${fmt(a.at)}</time></div>`).join("") || `<div class="empty">Activity will appear here as records are created.</div>`}
  </section>`;
}
function stat(label,value){return `<div class="card"><div class="stat-label">${esc(label)}</div><div class="stat-value">${esc(value)}</div><div class="stat-note">Current local records</div></div>`}
function truckPage(){
 return `<div class="row"><p class="muted">Vehicle profiles remain available for future loading records on this device.</p><button class="btn primary" data-action="add-truck">＋ Register truck</button></div>
 <section class="card table-wrap"><table><thead><tr><th>Registration</th><th>Configuration</th><th>Company</th><th>Capacity</th><th>Fleet no.</th><th>Added</th></tr></thead><tbody>
 ${data.trucks.map(t=>`<tr><td><strong>${esc(t.registration)}</strong><br><span class="small muted">Tractor ${esc(t.tractor||"—")} · trailers ${esc([t.trailer1,t.trailer2].filter(Boolean).join(", ")||"—")}</span></td><td>${esc(t.type)}<br><span class="small muted">${esc(t.axles||"—")} axles · ${esc(t.trailers||"0")} trailer(s)</span></td><td>${esc(t.company||"—")}</td><td>${esc(t.capacity||"—")} ${esc(t.capacityUnit||"t")}</td><td>${esc(t.fleet||"—")}</td><td>${fmt(t.createdAt)}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No vehicles registered.</td></tr>`}
 </tbody></table></section>`;
}
function driverPage(){
 return `<div class="row"><p class="muted">Driver records are stored locally and linked to loading references.</p><button class="btn primary" data-action="add-driver">＋ Add driver</button></div>
 <section class="card table-wrap"><table><thead><tr><th>Driver</th><th>ID / passport</th><th>Contact</th><th>Licence</th><th>Company</th><th>Added</th></tr></thead><tbody>
 ${data.drivers.map(d=>`<tr><td><strong>${esc(d.name)}</strong></td><td>${esc(d.identity||"—")}</td><td>${esc(d.phone||"—")}</td><td>${esc(d.licence||"—")} · ${esc(d.code||"—")}<br><span class="small muted">Expiry ${esc(d.expiry||"not recorded")}</span></td><td>${esc(d.company||"—")}</td><td>${fmt(d.createdAt)}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No drivers registered.</td></tr>`}
 </tbody></table></section>`;
}
function loadsPage(){
 return `<div class="row"><p class="muted">One loading reference connects vehicle, driver, order, documents, weight and dispatch.</p><button class="btn primary" data-action="new-load">＋ New truck loading</button></div>
 <section class="card table-wrap"><table><thead><tr><th>Reference</th><th>Type / order</th><th>Truck / driver</th><th>Commodity / destination</th><th>Documents</th><th>Status</th><th>Action</th></tr></thead><tbody>
 ${data.loads.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(l=>`<tr><td><strong>${esc(l.ref)}</strong><br><span class="small muted">${fmt(l.createdAt)}</span></td><td>${esc(l.type)}<br>${esc(l.orderRef||"No order reference")}</td><td>${esc(truckName(l.truckId))}<br><span class="small muted">${esc(driverName(l.driverId))}</span></td><td>${esc(l.commodity)}<br><span class="small muted">${esc(l.destination||"—")}</span></td><td>${requiredDocs(l).length-missingCount(l)}/${requiredDocs(l).length} verified</td><td>${pill(l.status)}</td><td><button class="btn small-btn" data-action="advance" data-id="${esc(l.id)}">Update</button> <button class="btn small-btn" data-action="weigh" data-id="${esc(l.id)}">Weight</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No loading records yet.</td></tr>`}
 </tbody></table></section>`;
}
function documentsPage(){
 return `<div class="row"><p class="muted">Upload a document to a load reference, then mark it verified after operator review. Files remain on this device.</p><button class="btn primary" data-action="upload-doc">＋ Add document</button></div>
 <section class="card table-wrap"><table><thead><tr><th>Document</th><th>Loading reference</th><th>File</th><th>Status</th><th>Uploaded</th><th></th></tr></thead><tbody>
 ${data.documents.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(d=>`<tr><td>${esc(d.type)}<br><span class="small muted">${esc(d.notes||"")}</span></td><td>${esc(byId(data.loads,d.loadId)?.ref||"—")}</td><td>${esc(d.fileName||"—")}</td><td>${pill(d.status)}</td><td>${fmt(d.createdAt)}</td><td>${d.status!=="Verified"?`<button class="btn small-btn" data-action="verify-doc" data-id="${esc(d.id)}">Verify</button>`:""}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No documents uploaded.</td></tr>`}
 </tbody></table></section>`;
}
function weighPage(){
 const rows=data.loads.filter(l=>l.tare!==undefined||l.gross!==undefined);
 return `<div class="notice">Net weight is calculated from recorded gross and tare weights. Confirm ticket details against the original weighbridge evidence.</div>
 <section class="card table-wrap"><table><thead><tr><th>Reference</th><th>Truck</th><th>Tare</th><th>Gross</th><th>Net</th><th>Ticket status</th><th></th></tr></thead><tbody>
 ${rows.map(l=>`<tr><td><strong>${esc(l.ref)}</strong></td><td>${esc(truckName(l.truckId))}</td><td>${esc(l.tare??"—")} ${esc(l.weightUnit||"t")}</td><td>${esc(l.gross??"—")} ${esc(l.weightUnit||"t")}</td><td>${l.netTonnes===undefined?"—":Number(l.netTonnes).toFixed(3)+" t"}</td><td>${pill(l.status)}</td><td><button class="btn small-btn" data-action="weigh" data-id="${esc(l.id)}">Edit weights</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No weighbridge entries recorded.</td></tr>`}
 </tbody></table></section>`;
}
function dispatchPage(){
 const dispatched=data.loads.filter(l=>l.status==="Dispatched");
 return `<div class="notice">Final dispatch is blocked until the required checklist is verified and valid tare and gross weights are recorded.</div>
 <section class="card table-wrap"><table><thead><tr><th>Reference</th><th>Truck / driver</th><th>Destination</th><th>Net weight</th><th>Departure</th><th>Status</th></tr></thead><tbody>
 ${dispatched.map(l=>`<tr><td>${esc(l.ref)}</td><td>${esc(truckName(l.truckId))}<br>${esc(driverName(l.driverId))}</td><td>${esc(l.destination||"—")}</td><td>${Number(l.netTonnes||0).toFixed(3)} t</td><td>${fmt(l.departedAt)}</td><td>${pill(l.status)}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No trucks dispatched yet.</td></tr>`}
 </tbody></table></section><h2 class="section-title" style="margin-top:20px">Loads awaiting dispatch</h2>
 <section class="card table-wrap"><table><thead><tr><th>Reference</th><th>Truck</th><th>Readiness</th><th>Action</th></tr></thead><tbody>
 ${data.loads.filter(l=>l.status!=="Dispatched").map(l=>`<tr><td>${esc(l.ref)}</td><td>${esc(truckName(l.truckId))}</td><td>${missingCount(l)===0&&l.netTonnes>0?pill("Ready for dispatch"):`${missingCount(l)} document issue(s) · ${l.netTonnes>0?"weight recorded":"weight outstanding"}`}</td><td><button class="btn small-btn" data-action="dispatch" data-id="${esc(l.id)}">Clear dispatch</button></td></tr>`).join("")||`<tr><td colspan="4" class="empty">No active loads.</td></tr>`}
 </tbody></table></section>`;
}
function issuesPage(){
 const issues=[];
 for(const l of data.loads.filter(x=>x.status!=="Dispatched")){
  for(const item of checklist(l)) if(item.status!=="Verified") issues.push(`<div class="issue"><strong>${esc(item.type)}</strong> · ${esc(item.status)}<br>Load ${esc(l.ref)} · truck ${esc(truckName(l.truckId))}<br><span class="muted">Required for the ${esc(l.type.toLowerCase())} loading checklist. Dispatch is blocked until verified.</span></div>`);
 }
 return `<p class="muted">Items shown are operational checks for this MVP. Configure and review site-specific legal and safety requirements before production use.</p>
 <section class="card">${issues.join("")||`<div class="empty">No outstanding checklist items.</div>`}</section>`;
}

function advanceLoad(id){
 const l=byId(data.loads,id);if(!l)return;
 const steps=["Booking created","Truck allocated","Arrived at mine","Awaiting document verification","Documents incomplete","Approved for loading","Loading in progress","Awaiting weighbridge","Weighed and completed","Awaiting dispatch clearance"];
 const next=steps[(steps.indexOf(l.status)+1)]||"Awaiting document verification";
 openModal("Update loading status",`<p><strong>${esc(l.ref)}</strong> · current status ${pill(l.status)}</p><div class="notice">Choose the next operational status only after the relevant site checks are completed.</div><div class="field"><label>New status</label><select id="nextStatus">${steps.map(s=>`<option ${s===next?"selected":""}>${esc(s)}</option>`).join("")}</select></div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="save-status" data-id="${esc(id)}">Save status</button></div>`);
}
async function attemptDispatch(id){
 const l=byId(data.loads,id);if(!l)return;
 const issues=checklist(l).filter(x=>x.status!=="Verified");
 if(issues.length){openModal("Dispatch blocked",`<div class="notice">Dispatch is blocked. Verify all required documents first.</div>${issues.map(x=>`<div class="issue">${esc(x.type)} · ${esc(x.status)}</div>`).join("")}<div class="actions"><button class="btn" data-close>Close</button><button class="btn primary" data-action="upload-doc">Add document</button></div>`);return}
 if(!(Number(l.netTonnes)>0)){openModal("Dispatch blocked",`<div class="notice">Valid tare and gross weights are required before dispatch.</div><div class="actions"><button class="btn" data-close>Close</button><button class="btn primary" data-action="weigh" data-id="${esc(id)}">Record weights</button></div>`);return}
 const t=byId(data.trucks,l.truckId);
 const cap=t?weightTonnes(t.capacity||0,t.capacityUnit||"t"):0;
 if(cap>0&&l.netTonnes>cap){openModal("Capacity check failed",`<div class="notice">Recorded net weight exceeds the truck's configured carrying capacity. Resolve the discrepancy before dispatch.</div><p>Net: ${Number(l.netTonnes).toFixed(3)} t · configured capacity: ${cap.toFixed(3)} t</p><div class="actions"><button class="btn" data-close>Close</button></div>`);return}
 if(!confirm("Confirm dispatch clearance? This records the local operator action and departure time."))return;
 l.status="Dispatched";l.departedAt=timeNow();l.updatedAt=timeNow();
 await put("loads",l);await audit("Dispatch authorised",l.ref);await refresh();
}
async function handleSubmit(e){
 e.preventDefault();const form=e.target;const fd=new FormData(form);
 if(form.id==="truckForm"){
  const r=Object.fromEntries(fd.entries());const file=fd.get("photo");
  const record={id:uid(),...r,photo:file&&file.size?file:null,createdAt:timeNow()};
  await put("trucks",record);await audit("Truck registered",record.registration);
 } else if(form.id==="driverForm"){
  const r=Object.fromEntries(fd.entries());const file=fd.get("photo");
  const record={id:uid(),...r,photo:file&&file.size?file:null,createdAt:timeNow()};
  await put("drivers",record);await audit("Driver registered",record.name);
 } else if(form.id==="loadForm"){
  const r=Object.fromEntries(fd.entries());
  const record={id:uid(),ref:loadRef(),...r,status:"Booking created",createdAt:timeNow(),updatedAt:timeNow()};
  await put("loads",record);await audit("Loading reference created",record.ref);
 } else if(form.id==="docForm"){
  const file=fd.get("file");const r=Object.fromEntries(fd.entries());
  const record={id:uid(),loadId:r.loadId,type:r.type,notes:r.notes,fileName:file.name,mimeType:file.type,size:file.size,blob:file,status:"Pending",createdAt:timeNow()};
  await put("documents",record);await audit("Document uploaded",`${r.type} for ${byId(data.loads,r.loadId)?.ref||"load"}`);
 } else if(form.id==="weightForm"){
  const l=byId(data.loads,form.dataset.id);if(!l)return;
  const r=Object.fromEntries(fd.entries());
  const tare=Number(r.tare),gross=Number(r.gross);
  if(gross<tare){alert("Gross weight cannot be less than tare weight.");return}
  l.tare=tare;l.gross=gross;l.weightUnit=r.weightUnit;
  l.tareTicket=r.tareTicket;l.grossTicket=r.grossTicket;
  l.netTonnes=weightTonnes(gross-tare,r.weightUnit);
  l.status="Weighed and completed";l.updatedAt=timeNow();
  await put("loads",l);await audit("Weights recorded",`${l.ref}: net ${l.netTonnes.toFixed(3)} t`);
 }
 closeModal();await refresh();
}

 const d=byId(data.documents,id);if(!d)return;
 if(!confirm("Confirm you reviewed this original document and verified it for this loading record?"))return;
 d.status="Verified";d.verifiedAt=timeNow();d.verifiedBy="Local operator";
 await put("documents",d);await audit("Document verified",`${d.type} for ${byId(data.loads,d.loadId)?.ref||"load"}`);await refresh();
}
function blobToData(blob){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);
 });
}
function dataToBlob(dataUrl){
 const [meta,b64]=dataUrl.split(",");
 const mime=(meta.match(/data:(.*?);base64/)||[])[1]||"application/octet-stream";
 const bin=atob(b64),arr=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 return new Blob([arr],{type:mime});
}
async function backup(){
 const out={format:"mine-dispatch-backup-v1",createdAt:timeNow(),records:{}};
 for(const n of STORE_NAMES){
  out.records[n]=[];
  for(const r of data[n]){
   const copy={...r};
   if(copy.blob instanceof Blob)copy.blobData=await blobToData(copy.blob),delete copy.blob;
   if(copy.photo instanceof Blob)copy.photoData=await blobToData(copy.photo),delete copy.photo;
   out.records[n].push(copy);
  }
 }
 download(JSON.stringify(out,null,2),"mine-dispatch-backup-"+Date.now()+".json","application/json");
}
function download(content,name,type){
 const blob=content instanceof Blob?content:new Blob([content],{type});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function csvExport(){
 const fields=["ref","type","orderRef","customer","commodity","grade","destination","status","tare","gross","netTonnes","createdAt","departedAt"];
 const csv=[fields.join(","),...data.loads.map(l=>fields.map(f=>`"${String(l[f]??"").replace(/"/g,'""')}"`).join(","))].join("\r\n");
 download(csv,"mine-loading-register.csv","text/csv;charset=utf-8");
}
async function restore(){
 const f=$("#restoreFile").files[0];if(!f){alert("Choose a JSON backup file first.");return}
 try{
  const parsed=JSON.parse(await f.text());
  if(parsed.format!=="mine-dispatch-backup-v1")throw new Error("Unsupported backup format.");
  if(!confirm("Restore and merge records from this backup? Matching record IDs will be replaced."))return;
  for(const n of STORE_NAMES){
   for(const r of parsed.records[n]||[]){
    if(r.blobData)r.blob=dataToBlob(r.blobData),delete r.blobData;
    if(r.photoData)r.photo=dataToBlob(r.photoData),delete r.photoData;
    await put(n,r);
   }
  }
  await audit("Backup restored","JSON backup merged into local database");
  await refresh();alert("Backup restored.");
 }catch(err){alert("Restore failed: "+err.message)}
}

 else if(a==="advance")advanceLoad(id);
 else if(a==="verify-doc")await verifyDoc(id);
 else if(a==="dispatch")await attemptDispatch(id);
 else if(a==="save-status"){
  const l=byId(data.loads,id);if(!l)return;
  l.status=$("#nextStatus").value;l.updatedAt=timeNow();
  await put("loads",l);await audit("Loading status changed",`${l.ref}: ${l.status}`);closeModal();await refresh();
 } else if(a==="backup")await backup();
 else if(a==="restore")await restore();
 else if(a==="csv")csvExport();
});
